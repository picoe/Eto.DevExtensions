# Oldest Rider supported, and the one downloaded to build against when no local install is found
riderVersion=2025.1
# Path to a Rider install to build and run with, instead of the newest one found on this machine
#riderPath=
# Set to false to always download riderVersion, e.g. to check the plugin still builds against it
#useLocalRider=false

kotlin.stdlib.default.dependency=false
org.gradle.caching=true
