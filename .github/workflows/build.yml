name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  DotNetVersion: "10.0.x"
  BuildParameters: "/v:Minimal /consoleLoggerParameters:NoSummary /p:Configuration=Release /p:BuildVersion=${{ github.run_id }} /p:BuildBranch=${{ github.ref }}"

jobs:
  build-windows:

    runs-on: windows-latest

    strategy:
      matrix:
        # 2022 also covers VS 2026
        vs: [ 2022 ]

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DotNetVersion }}

    - name: Setup msbuild
      uses: microsoft/setup-msbuild@v3

    - name: Build VS${{ matrix.vs }}
      run: msbuild /restore ${{ env.BuildParameters }} /p:VSVersion=${{ matrix.vs }} src\Eto.DevExtension.VisualStudio.Windows\Eto.DevExtension.VisualStudio.Windows.csproj /bl:artifacts/log/Build.Windows.${{ matrix.vs }}.binlog

    - name: Upload extensions
      uses: actions/upload-artifact@v7
      with:
        name: extensions-windows-${{ matrix.vs }}
        path: artifacts/Release/*.vsix

    - name: Upload log files
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: log-windows-${{ matrix.vs }}
        path: artifacts/log/**/*


  publish:
    needs: [ build-windows ]
    runs-on: ubuntu-latest
    if: (github.event_name == 'release' && github.event.action == 'published' && startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: extension*
          path: extensions
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R

      - name: Add extensions to release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true
          files: extensions/*.vsix
