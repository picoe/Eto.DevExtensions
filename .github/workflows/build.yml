name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # called by release.yml to build a release
  workflow_call:
    inputs:
      version:
        description: Version to build every package as, e.g. 1.2.3
        type: string
        default: ''

env:
  # must match the RecommendedXcodeVersion of the macOS workload pinned in workloads.json
  XcodeVersion: "26.6"
  BuildParameters: "/v:Minimal /consoleLoggerParameters:NoSummary /p:Configuration=Release /p:BuildVersion=${{ github.run_id }} /p:BuildBranch=${{ github.ref }}"

jobs:
  build-windows:

    runs-on: windows-latest

    strategy:
      matrix:
        # 2022 also covers VS 2026
        vs: [ 2022 ]

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Set version
      if: inputs.version
      run: dotnet msbuild .github/SetVersion.proj -p:ReleaseVersion=${{ inputs.version }}

    - name: Setup msbuild
      uses: microsoft/setup-msbuild@v3

    - name: Build VS${{ matrix.vs }}
      run: msbuild /restore ${{ env.BuildParameters }} /p:VSVersion=${{ matrix.vs }} src\Eto.DevExtension.VisualStudio.Windows\Eto.DevExtension.VisualStudio.Windows.csproj /bl:artifacts/log/Build.Windows.${{ matrix.vs }}.binlog

    - name: Upload extensions
      uses: actions/upload-artifact@v7
      with:
        name: extension-vs${{ matrix.vs }}
        path: artifacts/Release/*.vsix

    - name: Upload log files
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: log-windows-${{ matrix.vs }}
        path: artifacts/log/**/*

  build-vscode:

    # macOS so the package includes the Eto.macOS preview host
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        dotnet-version: 8.0.x

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XcodeVersion }}

    # pinned so the minimum macOS version doesn't drift
    - name: Install macOS workload
      run: dotnet workload install macos --from-rollback-file workloads.json

    - name: Set version
      if: inputs.version
      run: dotnet msbuild .github/SetVersion.proj -p:ReleaseVersion=${{ inputs.version }}

    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build extension
      working-directory: src/Eto.DevExtension.VSCode
      run: |
        npm ci
        npm run package

    - name: Upload extension
      uses: actions/upload-artifact@v7
      with:
        name: extension-vscode
        path: artifacts/vscode/*.vsix

    - name: Upload log files
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: log-vscode
        path: artifacts/log/**/*

  build-rider:

    # macOS so the plugin includes the Eto.macOS preview host
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        dotnet-version: 8.0.x

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XcodeVersion }}

    # pinned so the minimum macOS version doesn't drift
    - name: Install macOS workload
      run: dotnet workload install macos --from-rollback-file workloads.json

    - name: Set version
      if: inputs.version
      run: dotnet msbuild .github/SetVersion.proj -p:ReleaseVersion=${{ inputs.version }}

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'

    # caches the Rider download between runs
    - uses: gradle/actions/setup-gradle@v6

    - name: Build plugin
      working-directory: src/Eto.DevExtension.Rider
      # builds against the oldest supported Rider
      run: ./gradlew buildPlugin -PuseLocalRider=false

    - name: Upload plugin
      uses: actions/upload-artifact@v7
      with:
        name: extension-rider
        path: src/Eto.DevExtension.Rider/build/distributions/*.zip

    - name: Upload log files
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: log-rider
        path: artifacts/log/**/*
